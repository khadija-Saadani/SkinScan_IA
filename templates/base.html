<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkinScan AI — {% block title %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
  {% block head %}{% endblock %}
</head>
<body>

{% if session.get('user_id') %}
<nav class="navbar sticky-top">
  <div class="container d-flex align-items-center gap-2 flex-wrap">
    <a class="navbar-brand me-auto" href="{{ url_for('dashboard') }}">Skin<span>Scan</span> AI</a>

    <a href="{{ url_for('dashboard') }}" class="nav-pill {% if request.endpoint == 'dashboard' %}active{% endif %}">
      <i class="bi bi-grid-1x2"></i> Dashboard
    </a>
    <a href="{{ url_for('predict') }}" class="nav-pill {% if request.endpoint == 'predict' %}active{% endif %}">
      <i class="bi bi-search-heart"></i> Analysis
    </a>
    <a href="{{ url_for('patients') }}" class="nav-pill {% if request.endpoint == 'patients' %}active{% endif %}">
      <i class="bi bi-people"></i> Patients
    </a>
    <a href="{{ url_for('alerts') }}" class="nav-pill {% if request.endpoint == 'alerts' %}active{% endif %}" style="position:relative;">
      <i class="bi bi-bell-fill"></i> Alerts
      <span id="alertDot" style="position:absolute;top:-4px;right:-4px;width:9px;height:9px;background:var(--danger);border-radius:50%;display:none;"></span>
    </a>

    <div class="d-flex align-items-center gap-2 ms-1">
      <span class="badge-role">{{ session.get('role','doctor') }}</span>
      <span class="text-muted small fw-semibold d-none d-md-block">{{ session.get('full_name', session.get('username')) }}</span>
      <a href="{{ url_for('logout') }}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-box-arrow-right"></i>
      </a>
    </div>
  </div>
</nav>
{% endif %}

{% block content %}{% endblock %}

<div id="toastContainer" aria-live="polite"></div>
<script>
const FLASH_MESSAGES = [
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      { category: "{{ category }}", message: `{{ message | replace('`', "'") }}` },
    {% endfor %}
  {% endwith %}
];
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<style>
#toastContainer {
  position: fixed; top: 1.25rem; left: 50%; transform: translateX(-50%);
  z-index: 9999; display: flex; flex-direction: column; align-items: center;
  gap: 0.6rem; pointer-events: none; width: 100%; max-width: 520px; padding: 0 1rem;
}
.sk-toast {
  width: 100%; pointer-events: all; display: flex; align-items: flex-start;
  gap: 0.85rem; padding: 1rem 1.1rem; border-radius: 14px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.04), 0 12px 28px rgba(0,0,0,0.10), 0 0 0 1px rgba(0,0,0,0.06);
  background: rgba(255,255,255,0.97); border-left: 4px solid transparent;
  font-family: 'Figtree', sans-serif; position: relative; overflow: hidden;
  animation: toastIn 0.38s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
.sk-toast::after {
  content: ''; position: absolute; bottom: 0; left: 0; height: 2px;
  border-radius: 0; opacity: 0.6;
  animation: toastProgress linear forwards;
}
.sk-toast.success { border-left-color: #00c8a0; background: rgba(240,253,249,0.97); }
.sk-toast.success::after { background: #00c8a0; animation-duration: 4s; }
.sk-toast.danger  { border-left-color: #e8445a; background: rgba(255,238,241,0.97); }
.sk-toast.danger::after  { background: #e8445a; animation-duration: 5s; }
.sk-toast.warning { border-left-color: #f5a623; background: rgba(255,250,235,0.97); }
.sk-toast.warning::after { background: #f5a623; animation-duration: 5s; }
.sk-toast.info    { border-left-color: #0a6eb4; background: rgba(232,243,252,0.97); }
.sk-toast.info::after    { background: #0a6eb4; animation-duration: 4s; }
.sk-toast-icon {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.95rem; font-weight: 700; flex-shrink: 0;
}
.sk-toast.success .sk-toast-icon { background: #d1fae5; color: #059669; }
.sk-toast.danger  .sk-toast-icon { background: #fee2e2; color: #dc2626; }
.sk-toast.warning .sk-toast-icon { background: #fef3c7; color: #d97706; }
.sk-toast.info    .sk-toast-icon { background: #dbeafe; color: #2563eb; }
.sk-toast-body { flex: 1; min-width: 0; padding-top: 0.1rem; }
.sk-toast-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 0.2rem; }
.sk-toast.success .sk-toast-title { color: #065f46; }
.sk-toast.danger  .sk-toast-title { color: #991b1b; }
.sk-toast.warning .sk-toast-title { color: #92400e; }
.sk-toast.info    .sk-toast-title { color: #1e40af; }
.sk-toast-msg { font-size: 0.87rem; line-height: 1.5; margin: 0; }
.sk-toast.success .sk-toast-msg { color: #064e3b; }
.sk-toast.danger  .sk-toast-msg { color: #7f1d1d; }
.sk-toast.warning .sk-toast-msg { color: #78350f; }
.sk-toast.info    .sk-toast-msg { color: #1e3a5f; }
.sk-toast-close {
  background: none; border: none; cursor: pointer; padding: 0.2rem;
  border-radius: 6px; font-size: 0.9rem; opacity: 0.4;
  transition: opacity 0.15s; flex-shrink: 0; color: inherit;
}
.sk-toast-close:hover { opacity: 0.8; }
.sk-toast.dismissing { animation: toastOut 0.28s cubic-bezier(0.4,0,1,1) forwards; }
@keyframes toastIn { from { opacity:0; transform:translateY(-16px) scale(0.95); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes toastOut { from { opacity:1; transform:translateY(0) scale(1); max-height:120px; } to { opacity:0; transform:translateY(-12px) scale(0.95); max-height:0; padding:0; } }
@keyframes toastProgress { from { width:100%; } to { width:0%; } }
</style>
<script>
const _TCFG = { success:{icon:'✓',title:'Success'}, danger:{icon:'✕',title:'Error'}, warning:{icon:'⚠',title:'Warning'}, info:{icon:'i',title:'Info'} };
const _TDUR = { success:4000, danger:5000, warning:5000, info:4000 };
function showToast(cat, msg) {
  const c = _TCFG[cat] ? cat : 'info';
  const t = document.createElement('div');
  t.className = `sk-toast ${c}`;
  t.innerHTML = `<div class="sk-toast-icon">${_TCFG[c].icon}</div><div class="sk-toast-body"><p class="sk-toast-title">${_TCFG[c].title}</p><p class="sk-toast-msg">${msg}</p></div><button class="sk-toast-close" onclick="dismissToast(this.parentElement)">✕</button>`;
  document.getElementById('toastContainer').appendChild(t);
  t._timer = setTimeout(() => dismissToast(t), _TDUR[c]);
}
function dismissToast(t) {
  if (!t || t.classList.contains('dismissing')) return;
  clearTimeout(t._timer); t.classList.add('dismissing');
  t.addEventListener('animationend', () => t.remove(), { once: true });
}
window.showToast = showToast;
document.addEventListener('DOMContentLoaded', () => {
  FLASH_MESSAGES.forEach((m, i) => setTimeout(() => showToast(m.category, m.message), i * 150));
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
